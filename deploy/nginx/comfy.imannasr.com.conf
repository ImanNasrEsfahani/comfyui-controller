server {
    listen 80;
    listen [::]:80;
    server_name comfy.imannasr.com;
    return 301 https://comfy.imannasr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfy.imannasr.com;

    ssl_certificate /etc/ssl/cloudflare/grammar.imannasr.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/grammar.imannasr.com.key;

    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8100/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
