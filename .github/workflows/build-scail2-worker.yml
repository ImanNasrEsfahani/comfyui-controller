name: Build SCAIL-2 Worker (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'salad-worker/scail2/**'
      - 'backend/app/character_replace_api.py'
      - 'scripts/apply_scail2_overlay.py'
      - 'scripts/migrate_scail2.py'
      - 'tests/test_scail2*.py'
      - '.github/workflows/build-scail2-worker.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Source-only thin or model-baked image. Baked requires a self-hosted >=100GB builder.'
        type: choice
        options: [thin, baked]
        required: true
        default: thin

permissions:
  contents: read
  packages: write

jobs:
  thin:
    if: github.event_name == 'push' || inputs.profile != 'baked'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate SCAIL-2 source contracts
        run: |
          python -m pip install -r backend/requirements.txt 'huggingface_hub>=0.35,<2'
          command -v ffmpeg || { echo 'ffmpeg required for media simulation tests'; exit 1; }
          python -m unittest discover -s tests -p 'test_scail2*.py' -v
      - name: Normalize GHCR namespace
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: salad-worker/scail2/Dockerfile
          push: true
          provenance: true
          build-args: |
            BAKE_MODE=thin
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/comfyui-controller-scail2-worker:thin
          cache-from: type=gha,scope=scail2-thin
          cache-to: type=gha,scope=scail2-thin,mode=max
  baked:
    # Must provision this runner and its disk yourself; standard ubuntu-latest is too small.
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'baked'
    runs-on: [self-hosted, linux, x64, large-disk]
    steps:
      - uses: actions/checkout@v4
      - name: Validate SCAIL-2 source contracts
        run: |
          python -m pip install -r backend/requirements.txt 'huggingface_hub>=0.35,<2'
          command -v ffmpeg || { echo 'ffmpeg required for media simulation tests'; exit 1; }
          python -m unittest discover -s tests -p 'test_scail2*.py' -v
      - name: Normalize GHCR namespace
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: salad-worker/scail2/Dockerfile
          push: true
          provenance: true
          build-args: |
            BAKE_MODE=baked
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/comfyui-controller-scail2-worker:fp16-baked
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
