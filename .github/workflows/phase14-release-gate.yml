name: Phase 14 - Manual Release Evidence (NO DEPLOY)

# Run only after Unified CI succeeded on the same SHA. This workflow prepares
# auditable evidence; it does NOT start GPU, change SQLite, or deploy.
on:
  workflow_dispatch:
    inputs:
      enforce_release:
        description: 'Fail unless independently verified P0 staging evidence and approval exist'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release evidence tooling
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_phase14_*.py
          python -m pytest -q tests/test_ci_workflow_contract.py tests/test_ci_fixture_fixes.py tests/test_ci_node_report.py
      - name: Review composite Router/Worker integration WITHOUT modifying checkout
        run: |
          python scripts/phase14_prepare_checkout.py --repo .
          target="$(mktemp -d)"
          rmdir "$target"
          python scripts/phase14_prepare_checkout.py --repo . --export-dir "$target"
          python -m py_compile "$target/backend/app/main.py" "$target/backend/app/job_records.py" "$target/salad-worker/pull_worker.py"
          rm -rf "$target"
      - name: Generate offline release blockers and API inventory
        run: |
          mkdir -p qa
          python scripts/phase14_release_gate.py --repo . --output qa/release-status.json
          python scripts/phase14_api_inventory.py --repo . --output qa/api-mounts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-release-evidence-${{ github.sha }}
          path: qa/*.json
          if-no-files-found: warn
          retention-days: 30

  promotion-check:
    needs: [evidence]
    if: ${{ inputs.enforce_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicit fail-closed release verification (NO DEPLOY)
        run: python scripts/phase14_release_gate.py --repo . --enforce
