name: Phase 14 - non-deploying release evidence
on:
  workflow_dispatch:
    inputs:
      enforce_release:
        description: 'Require independently attested environment-bound P0 evidence'
        type: boolean
        required: false
        default: false
  pull_request:
    paths: ['backend/**','frontend/**','salad-worker/**','tests/**','scripts/phase14_*','scripts/ci_python_matrix.py','.github/workflows/phase14-release-gate.yml','docs/phase-*/HANDOFF.md','docker-compose.yml']
  push:
    branches: [main]
    paths: ['backend/**','frontend/**','salad-worker/**','tests/**','scripts/phase14_*','scripts/ci_python_matrix.py','.github/workflows/phase14-release-gate.yml','docs/phase-*/HANDOFF.md','docker-compose.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase14 tool tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_phase14_*.py
      - name: Composite source integration dry run (audited ancestry and blobs)
        run: python scripts/phase14_prepare_checkout.py --repo .
      - name: Export reviewed integration candidates and compile their syntax
        run: |
          target="$(mktemp -d)"
          rmdir "$target"
          python scripts/phase14_prepare_checkout.py --repo . --export-dir "$target"
          python -m py_compile "$target/backend/app/main.py" "$target/backend/app/job_records.py" "$target/salad-worker/pull_worker.py"
          python - "$target/backend/app/main.py" <<'PYVERIFY'
          import ast,sys
          p=sys.argv[1]
          tree=ast.parse(open(p,encoding='utf8').read())
          mounted=[c for c in ast.walk(tree) if isinstance(c,ast.Call) and isinstance(c.func,ast.Attribute) and c.func.attr=='include_router']
          if len(mounted)<8:raise SystemExit('Composite router count below expected, refuse candidate')
          print('Offline source export: '+str(len(mounted))+' routers, not a production activation')
          PYVERIFY
          rm -rf "$target"
      - name: Report release readiness (no promotion)
        if: always()
        run: |
          mkdir -p qa
          python scripts/phase14_release_gate.py --repo . --output qa/release-status.json
          python scripts/phase14_api_inventory.py --repo . --output qa/api-mounts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase14-gates-${{ github.sha }}
          path: qa/*.json
          if-no-files-found: error
          retention-days: 30
  backend-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r backend/requirements.txt pytest
      - name: Isolated all-file regression (no tests silently omitted)
        shell: bash
        run: |
          mkdir -p qa
          set +e
          python scripts/ci_python_matrix.py --repo . > qa/backend.raw 2>&1
          result=$?
          set -e
          python scripts/phase14_redact.py --input qa/backend.raw --output qa/backend.txt
          rm -f qa/backend.raw
          cat qa/backend.txt
          exit "$result"
      - name: Read-only runtime OpenAPI snapshot
        run: python scripts/phase14_api_inventory.py --repo . --runtime --output qa/openapi-import.json
      - name: Python/shell syntax
        run: |
          python -m compileall -q backend/app salad-worker scripts
          bash -n salad-worker/start.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase14-backend-${{ github.sha }}
          path: qa/*.txt
          if-no-files-found: warn
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies before JSX/TypeScript tests
        run: npm --prefix frontend install --no-audit --no-fund --package-lock=false
      - name: Run all frontend tests, including JSX syntax checks
        shell: bash
        run: |
          mkdir -p qa
          set +e
          node --test tests/*.mjs > qa/frontend.raw 2>&1
          result=$?
          set -e
          python3 scripts/phase14_redact.py --input qa/frontend.raw --output qa/frontend.txt
          rm -f qa/frontend.raw
          cat qa/frontend.txt
          exit "$result"
      - name: Build production Vite bundle
        run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase14-frontend-${{ github.sha }}
          path: qa/*.txt
          if-no-files-found: warn
          retention-days: 14
  promotion-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_release }}
    needs: [backend-worker, frontend, inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strictly require independent staging and security signoff
        run: python scripts/phase14_release_gate.py --repo . --enforce
