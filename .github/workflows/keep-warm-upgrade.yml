name: Legacy Keep Warm Upgrade (retired)

# Retired after migrating to the direct pull-worker architecture. Keep this
# workflow as a safe no-op so an accidental manual run CANNOT overwrite the
# controller with obsolete queue-autoscaler code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy upgrade is disabled
        run: |
          echo 'Retired: Keep Warm is managed by the direct queue controller.'
          echo 'Do not run scripts/apply-keep-warm.py on the direct branch.'
