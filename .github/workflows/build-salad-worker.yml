name: Build Salad GPU Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "salad-worker/**"
      - ".github/workflows/build-salad-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate direct queue before expensive GPU image build
        run: |
          python3 -m pip install -q -r backend/requirements.txt pytest
          PYTHONPATH=backend python3 -m pytest -q tests tests/check_frontend_backend_upgrade.py
          bash -n salad-worker/start.sh
          python3 -m compileall -q backend/app salad-worker

      - name: Run frontend regression tests and build
        run: |
          node --test tests/*.mjs
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DIRECT PULL FP8 worker with Python headers
        uses: docker/build-push-action@v6
        with:
          context: ./salad-worker
          file: ./salad-worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/imannasresfahani/comfyui-controller-salad-worker:fp8-direct-v1
          labels: |
            org.opencontainers.image.source=https://github.com/ImanNasrEsfahani/comfyui-controller

      - name: Inspect published chunked image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/imannasresfahani/comfyui-controller-salad-worker:fp8-direct-v1
