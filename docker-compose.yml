services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    volumes:
      - controller_data:/app/data
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3100:80"
    restart: unless-stopped

volumes:
  controller_data:
