services:
  backend:
    build:
      context: ./backend
    command: ["uvicorn", "app.integrated_main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./.env
    volumes:
      - controller_data:/app/data
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  # Legacy Direct Queue Scheduler remains separately authenticated. No v12
  # provider auto-execution is enabled by this release.
  scheduler:
    profiles: [direct]
    build:
      context: ./backend
    command: ["python", "-m", "app.direct_scheduler"]
    env_file:
      - ./.env
    volumes:
      - controller_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_UI_ENABLED: "true"
        VITE_WORKFLOW_STUDIO_ENABLED: "true"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3100:80"
    restart: unless-stopped

volumes:
  controller_data:
